name: Deploy Pages

on:
  workflow_dispatch:
    inputs:
      upstream_release_tag:
        description: Upstream release tag that triggered this deployment
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }} browser bundle
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both deployed variants use the Release+AOT WASM runtime. The debug
          # variant only enables the renderer hook used by the external harness.
          - name: release
            artifact: browser-release
            configuration: Release
            fable_defines: ""
            run_aot_compilation: "true"
          - name: debug
            artifact: browser-debug
            configuration: Release
            fable_defines: DEBUG
            run_aot_compilation: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET tools and Paket dependencies
        run: |
          dotnet tool restore
          dotnet paket restore

      - name: Restore .NET WASM workload
        run: dotnet workload restore web/wasm/Issie.Sidecar.Wasm.Host.csproj

      - name: Install npm dependencies
        run: npm ci --prefix web --ignore-scripts

      - name: Typecheck renderer
        run: npm --prefix web run typecheck

      - name: Build browser bundle
        env:
          ISSIE_WEB_BUILD_CONFIGURATION: ${{ matrix.configuration }}
          ISSIE_WEB_FABLE_DEFINES: ${{ matrix.fable_defines }}
          ISSIE_WEB_RUN_AOT_COMPILATION: ${{ matrix.run_aot_compilation }}
        run: npm --prefix web run build

      - name: Upload browser artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: web/build
          include-hidden-files: true
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release browser artifact
        uses: actions/download-artifact@v4
        with:
          name: browser-release
          path: site

      - name: Download debug browser artifact
        uses: actions/download-artifact@v4
        with:
          name: browser-debug
          path: site/debug

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
        continue-on-error: true

      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
