name: Deploy Pages

on:
  workflow_dispatch:
    inputs:
      upstream_release_tag:
        description: Upstream release tag that triggered this deployment
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install npm dependencies
        run: npm ci --prefix web --ignore-scripts

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Typecheck renderer
        run: npm --prefix web run typecheck

      - name: Build browser bundle
        run: npm --prefix web run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub Pages can leave a valid artifact in its deployment queue for several
          # minutes. Allow the service to drain the queue instead of cancelling at 10 minutes.
          timeout: 1800000
