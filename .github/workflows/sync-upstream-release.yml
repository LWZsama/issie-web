name: Sync upstream release

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: upstream-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read latest upstream release
        id: upstream_release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const upstreamOwner = "tomcl";
            const upstreamRepo = "issie";
            const release = (
              await github.rest.repos.getLatestRelease({
                owner: upstreamOwner,
                repo: upstreamRepo,
              })
            ).data;

            if (!/^v\d+\.\d+\.\d+$/.test(release.tag_name)) {
              throw new Error(`Unsupported upstream release tag: ${release.tag_name}`);
            }

            let localRelease = null;
            try {
              localRelease = (
                await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: release.tag_name,
                })
              ).data;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            core.setOutput("tag", release.tag_name);
            core.setOutput("local_release_exists", localRelease ? "true" : "false");

      - name: Rebase Web port onto the upstream release
        id: sync
        env:
          DEPLOY_REF: ${{ github.ref_name }}
          UPSTREAM_TAG: ${{ steps.upstream_release.outputs.tag }}
          LOCAL_RELEASE_EXISTS: ${{ steps.upstream_release.outputs.local_release_exists }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$DEPLOY_REF" != "master" ]]; then
            echo "The release sync must run on master, not $DEPLOY_REF." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote get-url upstream >/dev/null 2>&1 || git remote add upstream https://github.com/tomcl/issie.git
          git checkout -B "$DEPLOY_REF" "origin/$DEPLOY_REF"
          local_head=$(git rev-parse HEAD)
          git fetch --no-tags --force upstream "refs/tags/$UPSTREAM_TAG:refs/tags/upstream-release"

          upstream_sha=$(git rev-parse refs/tags/upstream-release^{commit})
          local_tag_sha=""
          if git rev-parse --verify "refs/tags/$UPSTREAM_TAG^{commit}" >/dev/null 2>&1; then
            local_tag_sha=$(git rev-parse "refs/tags/$UPSTREAM_TAG^{commit}")
          fi

          if git merge-base --is-ancestor "$upstream_sha" HEAD \
            && [[ "$local_tag_sha" == "$(git rev-parse HEAD)" ]] \
            && [[ "$LOCAL_RELEASE_EXISTS" == "true" ]]; then
            echo "Release $UPSTREAM_TAG already points at the current upstream-based commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rebase_base=$(git merge-base "$upstream_sha" HEAD)
          if [[ "$rebase_base" != "$upstream_sha" ]]; then
            # The desktop project-browser work added in 6.0.7+ overlaps the browser port's
            # FileUpdate module, while the browser event/persistence changes overlap a few
            # upstream implementation details. Resolve only these reviewed conflicts and
            # fail closed for anything else so a release is never built from an unreviewed
            # merge.
            if ! git rebase --onto "$upstream_sha" "$rebase_base" "$DEPLOY_REF"; then
              while true; do
                mapfile -t conflicts < <(git diff --name-only --diff-filter=U)

                if [[ "${#conflicts[@]}" -eq 0 ]]; then
                  echo "Rebase stopped without a conflict to resolve." >&2
                  git rebase --abort
                  exit 1
                fi

                # Validate the complete conflict set before changing any file. This keeps the
                # handler fail-closed if upstream introduces a new overlap in a future release.
                for conflict in "${conflicts[@]}"; do
                  case "$conflict" in
                    src/Renderer/Interface/FilesIO.fs|src/Renderer/Renderer.fs|src/Renderer/UI/FileUpdate.fs|.github/workflows/build.yml|.github/workflows/docs.yml)
                      ;;
                    *)
                      echo "Unexpected rebase conflict(s): ${conflicts[*]}" >&2
                      git rebase --abort
                      exit 1
                      ;;
                  esac
                done

                for conflict in "${conflicts[@]}"; do
                  case "$conflict" in
                    src/Renderer/Interface/FilesIO.fs)
                      # Preserve the browser-only demo autosave guard and adopt the upstream
                      # logging change without discarding other upstream edits in this file.
                      node <<'NODE'
          const fs = require("fs");
          const path = "src/Renderer/Interface/FilesIO.fs";
          const source = fs.readFileSync(path, "utf8");
          const eol = source.includes("\r\n") ? "\r\n" : "\n";
          const pattern = /^<<<<<<< HEAD\r?\n[\s\S]*?^=======\r?\n[\s\S]*?^>>>>>>> [^\r\n]*(?:\r?\n|$)/gm;
          const matches = [...source.matchAll(pattern)];
          if (
            matches.length !== 1
            || !matches[0][0].includes("isDemoProjectPath")
            || !matches[0][0].includes("Log.dbg Log.Files")
            || !matches[0][0].includes('printfn $"{fileName} Loaded"')
          ) {
            throw new Error("Unexpected FilesIO.fs conflict shape.");
          }
          const replacement = [
            "                    let autoComp =",
            "                        if isDemoProjectPath folderPath then",
            "                            Error \"Demo autosave disabled\"",
            "                        else",
            "                            filePath + \"auto\" |> tryLoadComponentFromPath",
            "                    Log.dbg Log.Files $\"loaded {fileName}\"",
          ].join(eol) + eol;
          fs.writeFileSync(path, source.replace(pattern, () => replacement));
          NODE
                      git add src/Renderer/Interface/FilesIO.fs
                      ;;
                    src/Renderer/Renderer.fs)
                      # Keep both the browser event handlers and upstream render diagnostics.
                      node <<'NODE'
          const fs = require("fs");
          const path = "src/Renderer/Renderer.fs";
          const source = fs.readFileSync(path, "utf8");
          const eol = source.includes("\r\n") ? "\r\n" : "\n";
          const pattern = /^<<<<<<< HEAD\r?\n[\s\S]*?^=======\r?\n[\s\S]*?^>>>>>>> [^\r\n]*(?:\r?\n|$)/gm;
          const matches = [...source.matchAll(pattern)];
          let resolved;
          if (
            matches.length === 1
            && matches[0][0].includes("DevHarness.recordModel model")
            && matches[0][0].includes("BrowserSession.installBeforeUnloadWarning model")
          ) {
            const replacement = [
              "    // the model the render is about to draw, for anything driving Issie from outside it",
              "    DevHarness.recordModel model",
              "    BrowserSession.installBeforeUnloadWarning model",
            ].join(eol) + eol;
            resolved = source.replace(pattern, () => replacement);
          } else {
            if (
              matches.length !== 3
              || !matches[0][0].includes("Log.countRender()")
              || !matches[0][0].includes("BrowserSession.installBeforeUnloadWarning model")
              || !matches[1][0].includes("shouldHandleCanvasShortcuts")
              || !matches[1][0].includes("focusCanvasElement ()")
              || !matches[2][0].includes("subBrowserContextMenuCommand")
            ) {
              throw new Error("Unexpected Renderer.fs conflict shape.");
            }
            const replacements = [
              [
                "    // Counted unconditionally - one increment - because a re-render storm is Issie's classic",
                "    // performance failure and nothing used to count renders at all.",
                "    Log.countRender()",
                "    BrowserSession.installBeforeUnloadWarning model",
              ].join(eol) + eol,
              [
                "            if shouldHandleCanvasShortcuts e.target then",
                "                e.preventDefault()",
                "                focusCanvasElement ()",
                "                dispatch (ContextMenuAction e)))",
              ].join(eol) + eol,
              [
                "    let subBrowserContextMenuCommand (dispatch: Msg -> unit) =",
                "        addBrowserContextMenuCommandListener (fun event ->",
                "            let arg = contextMenuArgsToString (getCustomEventDetail event)",
                "            match arg.Split [|','|] |> Array.toList with",
                "            | [ menuType ; item ] ->",
                "                dispatch <| ContextMenuItemClick(menuType, item, dispatch)",
                "            | _ -> printfn \"Unexpected browser context-menu callback argument.\")",
                "        { new System.IDisposable with member _.Dispose() = () }",
              ].join(eol) + eol,
            ];
            resolved = source;
            for (let index = matches.length - 1; index >= 0; index -= 1) {
              const start = matches[index].index;
              const end = start + matches[index][0].length;
              resolved = resolved.slice(0, start) + replacements[index] + resolved.slice(end);
            }
          }
          fs.writeFileSync(path, resolved);
          NODE
                      git add src/Renderer/Renderer.fs
                      ;;
                    src/Renderer/UI/FileUpdate.fs)
                      # The browser port intentionally replaces the desktop project browser.
                      git checkout --theirs -- src/Renderer/UI/FileUpdate.fs
                      git add src/Renderer/UI/FileUpdate.fs
                      ;;
                    src/Renderer/UI/Update.fs)
                      # Keep the browser bridge path for the context-menu update.
                      git checkout --ours -- src/Renderer/UI/Update.fs
                      git add src/Renderer/UI/Update.fs
                      ;;
                    .github/workflows/build.yml|.github/workflows/docs.yml)
                      # These upstream workflows are intentionally removed from the browser port.
                      git rm -- "$conflict"
                      ;;
                  esac
                done

                if GIT_EDITOR=true git rebase --continue; then
                  break
                fi
              done
            fi
          fi

          # Workflow files belong to this fork, not to the upstream desktop project. The default
          # GITHUB_TOKEN is a GitHub App token without the separate Workflows permission, so a
          # release push must not leave any upstream workflow change in the resulting tree. Restore
          # every workflow tracked by the pre-rebase fork and remove workflows that only upstream
          # introduced (including the desktop build/docs workflows).
          declare -A local_workflow_set=()
          mapfile -t local_workflows < <(git ls-tree -r --name-only "$local_head" -- .github/workflows)
          for workflow in "${local_workflows[@]}"; do
            local_workflow_set["$workflow"]=1
          done

          mapfile -t rebased_workflows < <(git ls-files .github/workflows)
          for workflow in "${rebased_workflows[@]}"; do
            if [[ -v "local_workflow_set[$workflow]" ]]; then
              git checkout "$local_head" -- "$workflow"
              git add "$workflow"
            else
              git rm -- "$workflow"
            fi
          done

          if [[ -n "$(git diff --name-only "$local_head" -- .github/workflows)" ]]; then
            echo "The rebased tree still changes a workflow owned by this fork." >&2
            git diff --name-status "$local_head" -- .github/workflows >&2
            exit 1
          fi

          release_version="${UPSTREAM_TAG#v}"
          npm --prefix web version "$release_version" --allow-same-version --no-git-tag-version --ignore-scripts

          RELEASE_VERSION="$release_version" node <<'NODE'
          const fs = require("fs");
          const version = process.env.RELEASE_VERSION;
          const packageVersion = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const source = fs.readFileSync("src/Renderer/Interface/Version.fs", "utf8");
          const match = source.match(/let VERSION = \[\s*"(\d+)"\s*;\s*"(\d+)"\s*;\s*"(\d+)"/);
          const sourceVersion = match ? match.slice(1).join(".") : null;

          if (packageVersion !== version || sourceVersion !== version) {
            throw new Error(
              `Release version mismatch: package.json=${packageVersion}, Version.fs=${sourceVersion}, expected=${version}`
            );
          }
          NODE

          if ! git diff --quiet -- web/package.json web/package-lock.json; then
            git add web/package.json web/package-lock.json
            git commit -m "chore(release): sync browser version to $UPSTREAM_TAG"
          fi

          if ! git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "The resulting branch is not based on $UPSTREAM_TAG." >&2
            exit 1
          fi

          new_head=$(git rev-parse HEAD)
          git push --force-with-lease origin "HEAD:refs/heads/$DEPLOY_REF"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$new_head" >> "$GITHUB_OUTPUT"

      - name: Build and deploy Pages
        if: steps.sync.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          DEPLOY_REF: ${{ github.ref_name }}
          UPSTREAM_TAG: ${{ steps.upstream_release.outputs.tag }}
          HEAD_SHA: ${{ steps.sync.outputs.head_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployWorkflow = "deploy-pages.yml";
            const dispatchStartedMs = Date.now();

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: deployWorkflow,
              ref: process.env.DEPLOY_REF,
              inputs: {
                upstream_release_tag: process.env.UPSTREAM_TAG,
              },
            });

            let deploymentRun = null;
            // A queued Pages deployment may take longer than the action's single 10-minute
            // attempt. Deploy Pages retries once, so allow the sync job to wait for both tries.
            for (let attempt = 0; attempt < 120; attempt += 1) {
              const runs = (
                await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: deployWorkflow,
                  event: "workflow_dispatch",
                  branch: process.env.DEPLOY_REF,
                  head_sha: process.env.HEAD_SHA,
                  per_page: 20,
                })
              ).data.workflow_runs;

              deploymentRun = runs
                .filter((run) => new Date(run.created_at).getTime() >= dispatchStartedMs)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0] ?? null;

              if (deploymentRun) {
                core.info(
                  `Deployment run ${deploymentRun.id}: ${deploymentRun.status}/${deploymentRun.conclusion ?? "pending"}`
                );
                if (deploymentRun.status === "completed") {
                  break;
                }
              }

              await new Promise((resolve) => setTimeout(resolve, 15000));
            }

            if (!deploymentRun || deploymentRun.status !== "completed") {
              throw new Error("Timed out waiting for the Deploy Pages workflow.");
            }
            if (deploymentRun.conclusion !== "success") {
              throw new Error(`Deploy Pages failed with conclusion ${deploymentRun.conclusion}.`);
            }

      - name: Remove stale release
        if: steps.sync.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          UPSTREAM_TAG: ${{ steps.upstream_release.outputs.tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const release = (
                await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: process.env.UPSTREAM_TAG,
                })
              ).data;
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
              core.info(`Removed the previous release ${process.env.UPSTREAM_TAG}.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

      - name: Recreate release tag
        if: steps.sync.outputs.changed == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.upstream_release.outputs.tag }}
          HEAD_SHA: ${{ steps.sync.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$UPSTREAM_TAG" >/dev/null 2>&1; then
            git push origin ":refs/tags/$UPSTREAM_TAG"
          fi
          if git show-ref --verify --quiet "refs/tags/$UPSTREAM_TAG"; then
            git tag -d "$UPSTREAM_TAG"
          fi
          git tag -a "$UPSTREAM_TAG" "$HEAD_SHA" -m "Release $UPSTREAM_TAG"
          git push origin "refs/tags/$UPSTREAM_TAG"

      - name: Publish release with upstream notes
        if: steps.sync.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          UPSTREAM_TAG: ${{ steps.upstream_release.outputs.tag }}
          HEAD_SHA: ${{ steps.sync.outputs.head_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const upstreamRelease = (
              await github.rest.repos.getLatestRelease({
                owner: "tomcl",
                repo: "issie",
              })
            ).data;

            const releaseOptions = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.UPSTREAM_TAG,
              target_commitish: process.env.HEAD_SHA,
              body: upstreamRelease.body ?? "",
              draft: false,
              prerelease: upstreamRelease.prerelease,
            };

            if (upstreamRelease.name !== null && upstreamRelease.name !== undefined) {
              releaseOptions.name = upstreamRelease.name;
            }

            await github.rest.repos.createRelease(releaseOptions);
            core.info(`Published release ${process.env.UPSTREAM_TAG}.`);
